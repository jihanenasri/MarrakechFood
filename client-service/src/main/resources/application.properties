spring.web.cors.allowed-origins=*

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

spring.web.cors.allowed-headers=*

spring.web.cors.allow-credentials=false

spring.web.cors.max-age=3600

server.port=${PORT:8080}

spring.application.name=client-service

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:marrakech_food}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=${MYSQLUSER:root}

spring.datasource.password=${MYSQLPASSWORD:password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
